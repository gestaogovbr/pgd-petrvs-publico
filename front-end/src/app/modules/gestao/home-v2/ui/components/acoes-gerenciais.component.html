@if (loading()) {
  <div class="d-flex justify-content-center align-items-center h-100">
    <span class="br-loading small" role="progressbar"></span>
  </div>
} @else {
  <div class="d-flex justify-content-around align-items-start h-100 gap-3">
    <home-atalho-card icone="bi bi-person-check" titulo="Meu Plano de Trabalho Vigente" (acao)="irParaPlanoTrabalho()" />
    <home-atalho-card icone="bi bi-eye" titulo="Meu Acompanhamento Especial de Entregas" [desabilitado]="true" />
  </div>
}

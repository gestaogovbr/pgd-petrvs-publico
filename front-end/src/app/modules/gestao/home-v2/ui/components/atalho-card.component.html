<div role="button" [attr.tabindex]="desabilitado() ? -1 : 0"
  class="home-atalho-sougov text-center"
  [class.home-atalho-sougov--disabled]="desabilitado()"
  [attr.aria-disabled]="desabilitado()"
  (click)="onClick()" (keydown.enter)="onClick()">
  <span class="home-atalho-sougov__circle">
    <i [class]="icone()" aria-hidden="true"></i>
  </span>
  <span class="home-atalho-sougov__label">{{ titulo() }}</span>
</div>

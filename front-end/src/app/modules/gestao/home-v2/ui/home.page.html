<app-breadcrumb></app-breadcrumb>

<div class="container-fluid px-4 py-3">
  <!-- Saudação -->
  <h2 class="fw-semibold mb-3">{{ saudacao() }}, {{ nomeUsuario() }}</h2>

  <!-- Controles de Topo -->
  <div class="row align-items-center mb-4">
    <div class="col-md-4">
      <br-select
        label="Unidade"
        [options]="unidadeOptions()"
        (valueChange)="onUnidadeChange($event)"
        class="w-100">
      </br-select>
    </div>
    <div class="col-md-3 d-flex align-items-center mt-auto flex-fill justify-content-end">
      @if (exibeToggleSubordinadas()) {
        <div class="br-switch">
          <input
            id="subordinadas-toggle"
            type="checkbox"
            [checked]="subordinadas()"
            (change)="onSubordinadasChange($any($event.target).checked)"
          />
          <label for="subordinadas-toggle">Unidades Subordinadas</label>
        </div>
      }
    </div>
  </div>

  <!-- Conteúdo do Dashboard -->
  @if (selectedUnidadeId()) {
    <!-- Linha 1: Pendências + Planos Vigentes + De Férias -->
    <div class="row mb-3">
      <div class="col-md-5 mb-3 mb-md-0">
        <home-pendencias-usuario />
      </div>
      <div class="col-md-4 mb-3 mb-md-0">
        <home-planos-vigentes class="d-block h-100" [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
      </div>
      <div class="col-md-3">
        <home-em-ferias [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
      </div>
    </div>

    <!-- Linha 2: Conteúdo principal + Aniversariantes -->
    <div class="row">
      <div class="col-lg-9">
        <!-- Ações Gerenciais -->
        <div class="row mb-3">
          <div class="col-12">
            <home-acoes-gerenciais [unidadeId]="selectedUnidadeId()" />
          </div>
        </div>

        <!-- Resumo Equipe + Contribuições -->
        <div class="row mb-3">
          <div class="col-md-8 mb-3 mb-md-0">
            <home-resumo-equipe [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
          </div>
          <div class="col-md-4">
            <home-contribuicoes [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
          </div>
        </div>
      </div>

      <!-- Aniversariantes -->
      <div class="col-lg-3 mb-3">
        <home-aniversariantes [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
      </div>
    </div>
  }
</div>

<app-breadcrumb></app-breadcrumb>

<div class="container-fluid px-4 py-3">
  <!-- Saudação -->
  <h2 class="fw-semibold mb-3">{{ saudacao() }}, {{ nomeUsuario() }}</h2>

  <!-- Row 1: Pendências + Atalhos (2x2 grid) -->
  <div class="row mb-3">
    <div class="col-md-6 mb-3 mb-md-0">
      <home-pendencias-usuario />
    </div>
    <div class="col-md-6">
      @if (selectedUnidadeId()) {
        <home-acoes-gerenciais [unidadeId]="selectedUnidadeId()" />
      }
    </div>
  </div>

  <!-- Row 2: Unidade + Toggle Subordinadas -->
  <div class="row align-items-center mb-4">
    <div class="col-md-4">
      <br-select
        label="Unidade"
        [options]="unidadeOptions()"
        (valueChange)="onUnidadeChange($event)"
        class="w-100">
      </br-select>
    </div>
    <div class="col-md-3 d-flex align-items-center mt-auto flex-fill justify-content-end">
      @if (exibeToggleSubordinadas()) {
        <div class="br-switch">
          <input
            id="subordinadas-toggle"
            type="checkbox"
            [checked]="subordinadas()"
            (change)="onSubordinadasChange($any($event.target).checked)"
          />
          <label for="subordinadas-toggle">Unidades Subordinadas</label>
        </div>
      }
    </div>
  </div>

  <!-- Conteúdo dependente de unidade selecionada -->
  @if (selectedUnidadeId()) {
    <!-- Row 3: Indicadores vigentes + Férias + Aniversariantes -->
    <div class="row mb-3">
      <div class="col-md-6 mb-3 mb-md-0">
        <home-planos-vigentes class="d-block h-100" [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
      </div>
      <div class="col-md-3 mb-3 mb-md-0">
        <home-em-ferias class="d-block h-100" [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
      </div>
      <div class="col-md-3">
        <home-aniversariantes class="d-block h-100" [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
      </div>
    </div>

    <!-- Row 4: Participantes + Capacidade + Contribuições -->
    <div class="row mb-3">
      <div class="col-md-8 mb-3 mb-md-0">
        <home-resumo-equipe [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
      </div>
      <div class="col-md-4">
        <home-contribuicoes [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
      </div>
    </div>
  }
</div>

<indicador-card
  [titulo]="titulo"
  [informacaoAdicional]="informacaoAdicional"
  [origemDados]="origemDados"
  [carregando]="carregando"
  [semDados]="semDados()">

  <div style="position: relative; height: 300px; width: 100%;">
    <canvas baseChart
      [data]="chartData()"
      [options]="chartOptions"
      type="line">
    </canvas>
  </div>

</indicador-card>

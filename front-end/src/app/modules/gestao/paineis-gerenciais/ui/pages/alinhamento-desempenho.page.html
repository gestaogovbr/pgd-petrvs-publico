<app-breadcrumb></app-breadcrumb>

<div class="container-fluid px-4 py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <painel-filtros
      [unidadeInicialId]="unidadeInicialId()"
      [unidadeInicialSigla]="unidadeInicialSigla()"
      [unidadeInicialNome]="unidadeInicialNome()"
      (filtrosChange)="onFiltrosChange($event)"
      (unidadeChange)="onUnidadeChange($event)"
      class="flex-grow-1" />

    <br-button emphasis="secondary" (click)="exportarPdf()" class="btn-exportar" [isLoading]="carregandoAlgum()" [disabled]="carregandoAlgum()">
      <i class="fas fa-file-pdf mr-1" aria-hidden="true"></i>Exportar PDF
    </br-button>
  </div>

  <div>
    <indicador-barra-horizontal
      [dados]="alinhamentoInstitucional()"
      [carregando]="carregandoAlinhamento()"
      titulo="Alinhamento institucional das Unidades por nível estratégico"
      informacaoAdicional="Apresenta a distribuição percentual das entregas de acordo com seu nível de alinhamento institucional, considerando entregas vinculadas ao Planejamento Institucional, à Cadeia de Valor, a ambos e entregas sem vinculação. São consideradas vinculadas ao Planejamento Institucional as entregas cujo encadeamento alcance o nível mais alto do planejamento (nível 1). São consideradas vinculadas à Cadeia de Valor as entregas cujo encadeamento alcance, no mínimo, o terceiro nível de processo (nível 3). A primeira linha do gráfico apresenta os dados da unidade selecionada, considerando as informações da própria unidade e as informações de todas as suas unidades subordinadas."
      origemDados="Sistema PGD Petrvs" />

    <indicador-barra-horizontal
      [dados]="avaliacoesPlanoEntrega()"
      [carregando]="carregandoAvaliacoesPE()"
      titulo="Notas das avaliações dos Planos de Entregas por Unidade organizacional"
      informacaoAdicional="Apresenta a distribuição percentual das notas atribuídas aos Planos de Entregas por unidade organizacional. A primeira linha do gráfico apresenta os dados da unidade selecionada, considerando as informações da própria unidade e as informações de todas as suas unidades subordinadas."
      origemDados="Sistema PGD Petrvs" />

    <indicador-barra-horizontal
      [dados]="avaliacoesPlanoTrabalho()"
      [carregando]="carregandoAvaliacoesPT()"
      titulo="Notas das avaliações dos Planos de Trabalho de acordo com as Unidades"
      informacaoAdicional="Apresenta a distribuição percentual das notas atribuídas aos períodos avaliativos dos Planos de Trabalho por unidade organizacional. A primeira linha do gráfico apresenta os dados da unidade selecionada, considerando as informações da própria unidade e as informações de todas as suas unidades subordinadas."
      origemDados="Sistema PGD Petrvs" />
  </div>
</div>

<app-breadcrumb></app-breadcrumb>

<div class="container-fluid px-4 py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <painel-filtros
      [unidadeInicialId]="unidadeInicialId()"
      [unidadeInicialSigla]="unidadeInicialSigla()"
      [unidadeInicialNome]="unidadeInicialNome()"
      modoData="referencia"
      [unidadeSearchFn]="unidadeSearchFn"
      (filtrosChange)="onFiltrosChange($event)"
      (unidadeChange)="onUnidadeChange($event)"
      class="flex-grow-1" />

    <br-button emphasis="secondary" (click)="exportarPdf()" [disabled]="carregandoAlgum()">
      <i class="fas fa-file-pdf mr-1" aria-hidden="true"></i>Exportar PDF
    </br-button>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <!-- Gráfico 1: Unidades Executoras por unidade organizacional -->
      <indicador-barra-horizontal
        [dados]="unidadesExecutoras()"
        [carregando]="carregandoUnidadesExec()"
        [titulo]="textos.unidadesExecutoras.titulo"
        [informacaoAdicional]="textos.unidadesExecutoras.info"
        [origemDados]="origemDados"
        [siglaPai]="unidadeInicialSigla()"
        [drillAtivo]="!!drillUnidadesExecutoras()"
        (unidadeClick)="onDrillDown(Grafico.UNIDADES_EXECUTORAS, $event)"
        (voltarClick)="onVoltarDrill(Grafico.UNIDADES_EXECUTORAS)" />
    </div>

    <div class="col-md-6">
      <!-- Gráfico 2: Evolução da adesão das Unidades ao PGD -->
      <indicador-card
        [titulo]="textos.evolucaoUnidades.titulo"
        [informacaoAdicional]="textos.evolucaoUnidades.info"
        [origemDados]="origemDados"
        [carregando]="carregandoEvolucaoUni()"
        [semDados]="!carregandoEvolucaoUni() && !evolucaoUnidades()">
        @if (evolucaoUnidades()) {
          <evolucao-adesao-chart
            [serie]="evolucaoUnidades()!.serie"
            labelPositivo="Executoras"
            labelNegativo="Não Executoras"
            campoPositivo="executoras"
            campoNegativo="nao_executoras" />
        }
      </indicador-card>
    </div>

    <div class="col-md-6">
      <!-- Gráfico 3: Participantes do PGD por unidade organizacional -->
      <indicador-barra-horizontal
        [dados]="participantesPGD()"
        [carregando]="carregandoParticipantes()"
        [titulo]="textos.participantesPGD.titulo"
        [informacaoAdicional]="textos.participantesPGD.info"
        [origemDados]="origemDados"
        [siglaPai]="unidadeInicialSigla()"
        [drillAtivo]="!!drillParticipantes()"
        (unidadeClick)="onDrillDown(Grafico.PARTICIPANTES_PGD, $event)"
        (voltarClick)="onVoltarDrill(Grafico.PARTICIPANTES_PGD)" />
    </div>

    <div class="col-md-6">
      <!-- Gráfico 4: Evolução da adesão dos agentes públicos ao PGD -->
      <indicador-card
        [titulo]="textos.evolucaoParticipantes.titulo"
        [informacaoAdicional]="textos.evolucaoParticipantes.info"
        [origemDados]="origemDados"
        [carregando]="carregandoEvolucaoPart()"
        [semDados]="!carregandoEvolucaoPart() && !evolucaoParticipantes()">
        @if (evolucaoParticipantes()) {
          <evolucao-adesao-chart
            [serie]="evolucaoParticipantes()!.serie"
            labelPositivo="Participantes"
            labelNegativo="Não Participantes"
            campoPositivo="participantes"
            campoNegativo="nao_participantes" />
        }
      </indicador-card>
    </div>
  </div>
</div>

<pdf-painel />

<app-breadcrumb></app-breadcrumb>

<div class="container-fluid px-4 py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <gestao-pgd-filtros
      [unidadeInicialId]="unidadeInicialId()"
      [unidadeInicialSigla]="unidadeInicialSigla()"
      [unidadeInicialNome]="unidadeInicialNome()"
      (filtrosChange)="onFiltrosChange($event)"
      class="flex-grow-1" />

    <br-button emphasis="secondary" (click)="exportarPdf()" [disabled]="carregandoAlgum()">
      <i class="fas fa-file-pdf mr-1" aria-hidden="true"></i>Exportar PDF
    </br-button>
  </div>

  <div>
    <!-- Gráfico 1: Unidades Executoras por unidade organizacional -->
    <indicador-barra-horizontal
      [dados]="unidadesExecutoras()"
      [carregando]="carregandoUnidadesExec()"
      titulo="Unidades Executoras por unidade organizacional"
      informacaoAdicional="Apresenta a distribuição percentual das unidades organizacionais de acordo com sua classificação como Unidade Executora ou Unidade não Executora. A primeira linha do gráfico apresenta os dados da unidade selecionada, considerando as informações da própria unidade e as informações de todas as suas unidades subordinadas."
      origemDados="Sistema PGD Petrvs" />

    <!-- Gráfico 2: Evolução da adesão das Unidades ao PGD -->
    <indicador-card
      titulo="Evolução da adesão das Unidades ao PGD"
      informacaoAdicional="Apresenta a evolução da adesão das unidades organizacionais ao PGD ao longo do período consultado."
      origemDados="Sistema PGD Petrvs"
      [carregando]="carregandoEvolucaoUni()"
      [semDados]="!carregandoEvolucaoUni() && !evolucaoUnidades()">
      @if (evolucaoUnidades()) {
        <evolucao-adesao-chart
          [serie]="evolucaoUnidades()!.serie"
          labelPositivo="Executoras"
          labelNegativo="Não Executoras"
          campoPositivo="executoras"
          campoNegativo="nao_executoras" />
      }
    </indicador-card>

    <!-- Gráfico 3: Participantes do PGD por unidade organizacional -->
    <indicador-barra-horizontal
      [dados]="participantesPGD()"
      [carregando]="carregandoParticipantes()"
      titulo="Participantes do PGD por unidade organizacional"
      informacaoAdicional="Apresenta a distribuição percentual dos agentes públicos ativos de acordo com sua participação no PGD. A primeira linha do gráfico apresenta os dados da unidade selecionada, considerando as informações da própria unidade e as informações de todas as suas unidades subordinadas."
      origemDados="Sistema PGD Petrvs" />

    <!-- Gráfico 4: Evolução da adesão dos agentes públicos ao PGD -->
    <indicador-card
      titulo="Evolução da adesão dos agentes públicos ao PGD"
      informacaoAdicional="Apresenta a evolução da adesão dos agentes públicos ao PGD ao longo do período consultado."
      origemDados="Sistema PGD Petrvs"
      [carregando]="carregandoEvolucaoPart()"
      [semDados]="!carregandoEvolucaoPart() && !evolucaoParticipantes()">
      @if (evolucaoParticipantes()) {
        <evolucao-adesao-chart
          [serie]="evolucaoParticipantes()!.serie"
          labelPositivo="Participantes"
          labelNegativo="Não Participantes"
          campoPositivo="participantes"
          campoNegativo="nao_participantes" />
      }
    </indicador-card>
  </div>
</div>

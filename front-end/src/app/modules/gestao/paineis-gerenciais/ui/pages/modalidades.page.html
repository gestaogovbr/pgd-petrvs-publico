<app-breadcrumb></app-breadcrumb>

<div class="container-fluid px-4 py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <painel-filtros
      [unidadeInicialId]="unidadeInicialId()"
      [unidadeInicialSigla]="unidadeInicialSigla()"
      [unidadeInicialNome]="unidadeInicialNome()"
      (filtrosChange)="onFiltrosChange($event)"
      (unidadeChange)="onUnidadeChange($event)"
      class="flex-grow-1" />

    <br-button emphasis="secondary" (click)="exportarPdf()" class="btn-exportar" [isLoading]="carregandoAlgum()" [disabled]="carregandoAlgum()">
      <i class="fas fa-file-pdf mr-1" aria-hidden="true"></i>Exportar PDF
    </br-button>
  </div>

  <div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <indicador-barra-vertical
          [dados]="teletrabalhoSubstituicao()"
          [carregando]="carregandoSubstituicao()"
          titulo="Participação na modalidade Teletrabalho no Exterior (VIII, art. 12, D.11072/22 - substituição)"
          informacaoAdicional="Apresenta o percentual de participantes em Teletrabalho no Exterior com fundamento no inciso VIII (substituição), permitindo compará-lo ao limite legal aplicável. Para fins de conformidade, considera-se o limite legal vigente na data da concessão da autorização para participação nessa modalidade."
          origemDados="Sistema PGD Petrvs"
          [saibaMaisRoute]="['relatorios', 'agentes']"
          [saibaMaisQueryParams]="saibaMaisParamsSubstituicao()" />
      </div>
      <div class="col-md-6">
        <indicador-barra-vertical
          [dados]="teletrabalhoDiscricionario()"
          [carregando]="carregandoDiscricionario()"
          titulo="Participação na modalidade Teletrabalho no Exterior (§7º, art. 12, D.11072/22 - discricionário)"
          informacaoAdicional="Apresenta o percentual de participantes em Teletrabalho no Exterior com fundamento no §7º, art. 12, D.11072/22 (discricionário), permitindo compará-lo ao limite legal aplicável. Para fins de conformidade, considera-se o limite legal vigente na data da concessão da autorização para participação nessa modalidade."
          origemDados="Sistema PGD Petrvs"
          [saibaMaisRoute]="['relatorios', 'agentes']"
          [saibaMaisQueryParams]="saibaMaisParamsDiscricionario()" />
      </div>
    </div>

    <indicador-barra-horizontal
      [dados]="modalidadesPorUnidade()"
      [carregando]="carregandoModalidades()"
      titulo="Modalidades de trabalho por unidade organizacional"
      informacaoAdicional="Apresenta a distribuição percentual dos participantes do PGD por modalidade de trabalho, de acordo com a unidade organizacional. A primeira linha do gráfico apresenta os dados da unidade selecionada, considerando as informações da própria unidade e as informações de todas as suas unidades subordinadas."
      origemDados="Sistema PGD Petrvs" />
  </div>
</div>

<app-breadcrumb></app-breadcrumb>

<div class="container-fluid px-4 py-3">
  <h2>Painéis Gerenciais</h2>

  <div class="d-flex gap-3 flex-column flex-md-row">
    @for (painel of paineis; track painel.rota) {
      <br-button emphasis="secondary" shape="block" (click)="navegarPara(painel.rota)">
        {{ painel.titulo }}
      </br-button>
    }
  </div>
</div>

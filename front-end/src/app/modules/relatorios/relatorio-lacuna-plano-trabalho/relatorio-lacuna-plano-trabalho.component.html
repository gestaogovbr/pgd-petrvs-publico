<grid
  [dao]="dao"
  [title]="title"
  [orderBy]="orderBy"
  [maxHeight]="450"
  [scrollable]="true"
  [className]="'relatorio-lacuna-pt'"
>
  <toolbar *ngIf="!selectable"></toolbar>
  <filter
    [form]="filter"
    [where]="filterWhere"
    [submit]="filterSubmit.bind(this)"
    [filter]="onButtonFilterClick"
    filterLabel="Consultar"
    [hasExportExcel]="true"
    [exportExcel]="exportExcel"
    [excelFileName]="'relatorio-lacunas-plano-trabalho.xlsx'"
  >
    <div class="row" style="align-items: flex-end;">
      <input-search
        #unidade
        [size]="5"
        label="Unidade de Consulta"
        [control]="filter!.controls.unidade_id"
        controlName="unidade_id"
        [dao]="unidadeDao"
        [selectRoute]="{
          route: ['configuracoes', 'unidade'],
          params: { unidades: auth.hasPermissionTo(permissao + '_TODAS_UNIDADES') ? null : this.unidades }
        }"
        [where]="auth.hasPermissionTo(permissao + '_TODAS_UNIDADES')
          ? []
          : [['id', 'in', this.unidades]]"
      ></input-search>
      <input-datetime
        [size]="2"
        date
        label="Período para consulta: início"
        controlName="periodo_inicio"
        [control]="filter!.controls.periodo_inicio"
        labelInfo="Data início de consulta"
      ></input-datetime>
      <input-datetime
        [size]="2"
        date
        label="Período para consulta: fim"
        controlName="periodo_fim"
        [control]="filter!.controls.periodo_fim"
        labelInfo="Data fim da consulta"
      ></input-datetime>
      <input-switch
        [size]="2"
        label="Unidades Subordinadas"
        controlName="incluir_unidades_subordinadas"
        [control]="filter!.controls.incluir_unidades_subordinadas"
      ></input-switch>
    </div>
  </filter>

  <columns>
    <column
      title="Agente Público"
      [template]="columnNome"
      [titleTemplate]="titleNome"
      [verticalAlign]="'bottom'"
      [width]="200"
    >
      <ng-template let-header="header" #titleNome>
        <input-text
          [control]="filter!.controls.nome"
          controlName="this.filter.nome"
          (blur)="onValueChange($event)"
        ></input-text>
      </ng-template>
      <ng-template let-row="row" #columnNome>
        <a
          class="link"
          (click)="go.navigate({ route: ['configuracoes', 'usuario', row.usuario_id, 'edit'] })"
          >{{ row.nome_exibicao }}</a
        >
      </ng-template>
    </column>

    <column
      title="Matrícula Siape"
      [template]="columnMatricula"
      [titleTemplate]="titleMatricula"
      [verticalAlign]="'bottom'"
      [width]="100"
    >
      <ng-template let-header="header" #titleMatricula>
        <input-text
          [control]="filter!.controls.matricula"
          controlName="this.filter.matricula"
          (blur)="onValueChange($event)"
        ></input-text>
      </ng-template>
      <ng-template let-row="row" #columnMatricula>
        <span>{{ row.matricula || '-' }}</span>
      </ng-template>
    </column>

    <column
      title="Lotação"
      [template]="columnLotacao"
      [titleTemplate]="titleLotacao"
      [verticalAlign]="'bottom'"
      [width]="220"
    >
      <ng-template let-header="header" #titleLotacao>
        <input-text
          [control]="filter!.controls.unidadeNome"
          controlName="this.filter.unidadeNome"
          (blur)="onValueChange($event)"
        ></input-text>
      </ng-template>
      <ng-template let-row="row" #columnLotacao>
        <span>{{ row.unidadeHierarquia || row.unidadeNome || '-' }}</span>
      </ng-template>
    </column>

    <column
      title="Lacuna"
      [titleHint]="lacunaHint"
      [template]="columnLacuna"
      [titleTemplate]="titleLacuna"
      [verticalAlign]="'bottom'"
      [width]="180"
    >
      <ng-template let-header="header" #titleLacuna>
        <input-text
          [control]="filter!.controls.lacuna"
          controlName="this.filter.lacuna"
          (blur)="onValueChange($event)"
        ></input-text>
      </ng-template>
      <ng-template let-row="row" #columnLacuna>
        <span>{{ row.lacuna }}</span>
      </ng-template>
    </column>

    <column
      title="Quantidade de Dias"
      [template]="columnQtde"
      [titleTemplate]="titleQtde"
      [verticalAlign]="'bottom'"
      [align]="'center'"
      [width]="120"
    >
      <ng-template let-header="header" #titleQtde>
        <input-text
          [control]="filter!.controls.quantidade_dias"
          controlName="this.filter.quantidade_dias"
          (blur)="onValueChange($event)"
        ></input-text>
      </ng-template>
      <ng-template let-row="row" #columnQtde>
        <span>{{ row.quantidade_dias }}</span>
      </ng-template>
    </column>

    <column
      title="Ocorrências"
      [template]="columnOcorrencias"
      [titleTemplate]="titleOcorrencias"
      [verticalAlign]="'bottom'"
      [width]="280"
    >
      <ng-template let-header="header" #titleOcorrencias>
        <input-text
          [control]="filter!.controls.ocorrencias_texto"
          controlName="this.filter.ocorrencias_texto"
          (blur)="onValueChange($event)"
        ></input-text>
      </ng-template>
      <ng-template let-row="row" #columnOcorrencias>
        <span>{{ row.ocorrencias_texto || 'Sem ocorrência' }}</span>
      </ng-template>
    </column>
  </columns>
</grid>

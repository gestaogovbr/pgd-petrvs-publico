<paginated-select
  [label]="label"
  [placeholder]="'Pesquise por nome ou sigla'"
  [emptyText]="'Nenhuma unidade encontrada'"
  [perPage]="perPage"
  [value]="displayValue()"
  [searchFn]="search"
  [displayFn]="displayFn"
  (selected)="onSelected($event)"
>
  <ng-template #itemTemplate let-unidade>
    <strong>{{ unidade.sigla }}</strong> - {{ unidade.nome }}
  </ng-template>
</paginated-select>
